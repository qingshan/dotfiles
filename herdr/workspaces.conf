# Pre-defined herdr workspaces shown by `tmux-sessions all` (the herdr counterpart of
# tmux's @SESSIONS). One per line: <label> <work directory> [agent command...]
# The work directory supports a leading ~ or $PROJECTS. The agent command is optional and
# is run in the workspace's first pane when the workspace is created.
main      ~
notes     ~/.notes       claude
dotfiles  ~/.dotfiles    claude
