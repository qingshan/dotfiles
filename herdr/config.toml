onboarding = false

[update]
version_check = false
manifest_check = false

[remote]
manage_ssh_config = true

[terminal]
shell_mode = "login"

[ui]
agent_panel_sort = "spaces"
pane_borders = true
pane_gaps = false
hide_tab_bar_when_single_tab = false
prompt_new_tab_name = false
confirm_close = false

window_title = "{hostname}: {workspace}"
status_indicators = "symbols"

[ui.toast]
delivery = "terminal"

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"]]

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["agent"],
]

[session]
resume_agents_on_restore = true

[experimental]
allow_nested = false
kitty_graphics = false
pane_history = false

[keys]
prefix = "ctrl+\\"
detach = "prefix+d"

# workspace
new_workspace = "prefix+shift+w"
previous_workspace = "prefix+shift+["
next_workspace = "prefix+shift+]"
close_workspace = "prefix+shift+d"
focus_agent = "prefix+shift+1..9"

# tab
switch_tab = "prefix+1..9"
previous_tab = "prefix+p"
next_tab = "prefix+n"
new_tab = "prefix+c"
close_tab = "prefix+&"

# pane
split_horizontal = "prefix+%"
split_vertical = "prefix+\""
close_pane = "prefix+x"
last_pane = "prefix+;"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

swap_pane_left = "prefix+ctrl+h"
swap_pane_down = "prefix+ctrl+j"
swap_pane_up = "prefix+ctrl+k"
swap_pane_right = "prefix+ctrl+l"

# popups
goto = "prefix+shift+y"

[[keys.command]]
key = "prefix+shift+b"
type = "shell"
command = "/usr/bin/open -a Alacritty"
description = "run alacritty"

# type = "popup"/"pane" custom commands always run via a non-login `/bin/sh
# -c`, which never sources ~/.profile; that PATH only has ~/.dotfiles/bin
# (where these tmux-* helper scripts live) when the herdr server process
# itself happened to inherit it (e.g. started from a login shell in
# ghostty). Remote servers auto-started over SSH get a bare system PATH
# instead, so wrap each command in `bash -lc` to force a login shell and
# reliably pick up PATH regardless of how the server was launched.
[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "bash -lc 'tmux-grep | xargs -r tmux-vim'"
description = "grep files"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+c"
type = "popup"
command = "bash -lc 'tmux-commands | xargs -o -r tmux-run -t window --'"
description = "commands"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+r"
type = "popup"
command = "tmux-run menu"
description = "project menu"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+r"
type = "popup"
command = "tmux-run commands"
description = "commands"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+e"
type = "popup"
command = "bash -lc 'tmux-apps menu'"
description = "apps menu"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+p"
type = "popup"
command = "bash -lc 'tmux-apps menu'"
description = "apps menu"
width = "80%"
height = "80%"
